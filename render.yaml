# Render Blueprint.
#
# Committing the service definition means the runtime cannot drift back to a
# native buildpack, which silently ignores the Dockerfile — the corpus stage
# never runs and the server starts with no Bible database.
#
# To adopt: Render Dashboard -> New -> Blueprint -> pick this repo.
# An existing service can also be switched by hand; see docs/deploying.md.

services:
  - type: web
    name: scholia-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: frankfurt
    healthCheckPath: /api/v1/books

    envVars:
      # Supabase Postgres. Use the SESSION POOLER host — the direct
      # db.<ref>.supabase.co host is IPv6-only and unreachable from Render.
      # URL-encode the password: @ -> %40, ! -> %21, # -> %23.
      - key: DATABASE_URL
        sync: false

      # https://<project-ref>.supabase.co — used to derive the token issuer and
      # the JWKS endpoint. No Supabase API key is needed: the server only
      # verifies tokens, against public keys.
      - key: SUPABASE_URL
        sync: false

      # Origins allowed to call this API from a browser.
      - key: SCHOLIA_CORS_ORIGINS
        value: https://scholia-web-coral.vercel.app,http://localhost:3000

    # PORT is injected by Render and read by the server. Do not set it here.
